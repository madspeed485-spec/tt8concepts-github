# This workflow builds the Astro site and publishes it to GitHub Pages.
# It runs automatically every time you push (or upload files) to the "main"
# branch. You can also run it by hand: GitHub repo > Actions tab >
# "Deploy to GitHub Pages" > "Run workflow".
# (Repo Settings > Pages > Source must be set to "GitHub Actions".)
name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        # Official Astro action: runs `npm ci` + `npm run build` and uploads dist/
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
